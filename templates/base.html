<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>CYBER-BREAKOUT 2088 | 형광 핑크 & 네온 다크</title>
    <link href="https://fonts.googleapis.com/css2?family=Orbitron:wght@500;700;900&family=Rajdhani:wght@600;700&display=swap" rel="stylesheet">
    <style>
        :root {
            --bg-black: #05050a;
            --card-dark: #0a0c14;
            --neon-pink: #ff0055;
            --neon-hotpink: #ff007f;
            --neon-cyan: #00f0ff;
            --neon-yellow: #ffe600;
            --border-pink: rgba(255, 0, 85, 0.4);
        }

        * { box-sizing: border-box; margin: 0; padding: 0; }

        body {
            background-color: var(--bg-black);
            background-image: 
                radial-gradient(rgba(255, 0, 85, 0.12) 1px, transparent 1px),
                linear-gradient(180deg, #07060f 0%, #030306 100%);
            background-size: 28px 28px, 100% 100%;
            color: #f1f5f9;
            font-family: 'Rajdhani', sans-serif;
            min-height: 100vh;
        }

        /* HEADER */
        .header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 1.2rem 3rem;
            background: rgba(7, 6, 15, 0.95);
            border-bottom: 2px solid var(--neon-pink);
            box-shadow: 0 0 25px rgba(255, 0, 85, 0.35);
            position: sticky;
            top: 0;
            z-index: 100;
        }
        .logo a {
            font-family: 'Orbitron', sans-serif;
            font-size: 1.5rem;
            font-weight: 900;
            color: #fff;
            text-decoration: none;
            letter-spacing: 2px;
            text-shadow: 0 0 10px var(--neon-pink);
        }
        .logo span { color: var(--neon-pink); text-shadow: 0 0 15px var(--neon-pink); }
        .nav a {
            color: #94a3b8;
            text-decoration: none;
            margin: 0 1.2rem;
            font-size: 1rem;
            font-weight: 700;
            font-family: 'Orbitron';
            letter-spacing: 1px;
            transition: 0.2s;
        }
        .nav a:hover, .nav a.highlight { color: var(--neon-pink); text-shadow: 0 0 10px var(--neon-pink); }
        .status-badge {
            font-family: 'Orbitron';
            font-size: 0.8rem;
            color: var(--neon-pink);
            display: flex;
            align-items: center;
            gap: 8px;
            text-shadow: 0 0 8px var(--neon-pink);
        }
        .status-dot { width: 9px; height: 9px; background: var(--neon-pink); border-radius: 50%; box-shadow: 0 0 12px var(--neon-pink); }

        /* CHATBOT */
        .chat-widget {
            position: fixed; bottom: 25px; right: 25px; width: 350px;
            background: #070710; border: 2px solid var(--neon-pink);
            border-radius: 4px;
            z-index: 1000; box-shadow: 0 0 30px rgba(255, 0, 85, 0.35);
            overflow: hidden;
        }
        .chat-header {
            background: linear-gradient(90deg, #2b0414 0%, #0d0614 100%);
            padding: 0.8rem 1rem; display: flex;
            justify-content: space-between; font-family: 'Orbitron'; font-size: 0.85rem; color: var(--neon-pink);
            border-bottom: 1px solid var(--border-pink);
        }
        .chat-header button { background: none; border: none; color: #fff; cursor: pointer; font-size: 1.2rem; }
        .chat-body { display: flex; flex-direction: column; height: 290px; }
        .chat-log { flex: 1; padding: 1rem; overflow-y: auto; font-size: 0.9rem; }
        .chat-msg { margin-bottom: 0.7rem; line-height: 1.5; }
        .chat-msg.user { color: var(--neon-yellow); text-align: right; }
        .chat-msg.bot { color: #f1f5f9; }
        .chat-input-area { display: flex; border-top: 1px solid var(--border-pink); background: #04040a; }
        .chat-input-area input { flex: 1; background: transparent; border: none; padding: 0.8rem; color: #fff; outline: none; }
        .chat-input-area button {
            background: var(--neon-pink); border: none; color: #fff; padding: 0 1.2rem;
            font-family: 'Orbitron'; font-weight: bold; cursor: pointer; transition: 0.2s;
        }
        .chat-input-area button:hover { background: #ff2a77; box-shadow: 0 0 15px var(--neon-pink); }
    </style>
</head>
<body>
    <header class="header">
        <div class="logo">
            <a href="{{ url_for('index') }}">CYBER<span>//BREAKOUT</span></a>
        </div>
        <nav class="nav">
            <a href="{{ url_for('index') }}">ACTIVE SECTORS</a>
            <a href="{{ url_for('index') }}#avatar-studio" class="highlight">⚡ RUNNER ID FORGE</a>
        </nav>
        <div class="status-badge">
            <div class="status-dot"></div> NEON NET ACTIVE
        </div>
    </header>

    <main>
        {% block content %}{% endblock %}
    </main>

    <!-- 형광 핑크 해킹 AI 챗봇 -->
    <div id="cyber-chat-widget" class="chat-widget">
        <div id="chat-header">
            <span>AEGIS-0 TACTICAL ASSIST</span>
            <button id="chat-toggle-btn">_</button>
        </div>
        <div id="chat-body">
            <div class="chat-log" id="chat-log">
                <div class="chat-msg bot">
                    <span style="color:var(--neon-pink); font-weight:bold;">[AEGIS]</span> 시스템 온라인. 도움이 필요하면 <b>'1번 힌트'</b> 또는 <b>'1번 정답'</b>을 입력하십시오.
                </div>
            </div>
            <div class="chat-input-area">
                <input type="text" id="chat-input" placeholder="명령어 입력 (예: 1번 힌트)..." autocomplete="off">
                <button id="chat-send-btn">DECODE</button>
            </div>
        </div>
    </div>

    <script src="{{ url_for('static', filename='js/chatbot.js') }}"></script>
</body>
</html>
